<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm space-y-4"
  >
    <h2 class="text-2xl font-semibold text-center">Login</h2>

    <!-- Email -->
    <div>
      <label class="block mb-1 text-sm font-medium">Email</label>
      <input
        type="email"
        formControlName="email"
        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
        [class.border-red-500]="email?.invalid && email?.touched"
      />
      <div
        *ngIf="email?.invalid && email?.touched"
        class="text-red-500 text-sm mt-1"
      >
        <div *ngIf="email?.errors?.['required']">Email is required.</div>
        <div *ngIf="email?.errors?.['email']">Invalid email format.</div>
      </div>
    </div>

    <!-- Password -->
    <div>
      <label class="block mb-1 text-sm font-medium">Password</label>
      <input
        type="password"
        formControlName="password"
        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
        [class.border-red-500]="password?.invalid && password?.touched"
      />
      <div
        *ngIf="password?.invalid && password?.touched"
        class="text-red-500 text-sm mt-1"
      >
        <div *ngIf="password?.errors?.['required']">Password is required.</div>
        <div *ngIf="password?.errors?.['minlength']">Minimum 6 characters.</div>
      </div>
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
    >
      Login
    </button>
  </form>
</div>
